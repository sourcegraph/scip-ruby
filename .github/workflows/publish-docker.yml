name: 'Publish Docker'

# release.yml dispatches this workflow once the release has its binaries.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish Docker image for (scip-ruby-vM.N.P)'

jobs:
  release-image:
    runs-on: 'ubuntu-24.04'
    permissions:
      contents: read
    steps:
      - id: version
        run: |
          # From https://stackoverflow.com/questions/10649814/get-last-git-tag-from-a-remote-repo-without-cloning
          LATEST_TAG="$(git -c 'versionsort.suffix=-' \
            ls-remote --exit-code --refs --sort='version:refname' --tags https://github.com/sourcegraph/scip-ruby.git 'scip-ruby-v*' \
            | tail --lines=1 \
            | cut --delimiter='/' --fields=3)"
          TAG="${TAG:-$LATEST_TAG}"
          PATCH="${TAG/scip-ruby-v/}"
          MINOR="${PATCH%.*}"
          MAJOR="${MINOR%.*}"
          {
            echo "TAG=$TAG"
            echo "PATCH=$PATCH"
          } >> "$GITHUB_ENV"
          # Only the latest release moves the floating tags, so republishing
          # an older release doesn't roll them back.
          AUTOINDEX_TAGS="sourcegraph/scip-ruby:autoindex-$PATCH"
          SCIP_RUBY_TAGS="sourcegraph/scip-ruby:$PATCH"
          if [ "$TAG" = "$LATEST_TAG" ]; then
            AUTOINDEX_TAGS+=$'\n'"sourcegraph/scip-ruby:autoindex"$'\n'"sourcegraph/scip-ruby:autoindex-$MINOR"$'\n'"sourcegraph/scip-ruby:autoindex-$MAJOR"
            SCIP_RUBY_TAGS+=$'\n'"sourcegraph/scip-ruby:latest"$'\n'"sourcegraph/scip-ruby:$MINOR"$'\n'"sourcegraph/scip-ruby:$MAJOR"
          fi
          {
            printf 'autoindex_tags<<EOF\n%s\nEOF\n' "$AUTOINDEX_TAGS"
            printf 'scip_ruby_tags<<EOF\n%s\nEOF\n' "$SCIP_RUBY_TAGS"
          } >> "$GITHUB_OUTPUT"
        env:
          TAG: ${{ inputs.tag }}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.TAG }}
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
        with:
          driver: docker
      - name: Login to DockerHub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build base image (not published)
        id: docker_build_base
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          builder: ${{ steps.buildx.outputs.name }}
          file: Dockerfile.base
          push: false
          load: true
          build-args: |
            SCIP_RUBY_VERSION=${{ env.PATCH }}
          tags: |
            scip-ruby-base:${{ env.PATCH }}
      - name: Build and push autoindex image
        id: docker_build_autoindex
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          builder: ${{ steps.buildx.outputs.name }}
          file: Dockerfile.autoindex
          push: true
          build-contexts: |
            scip-ruby-base=docker-image://scip-ruby-base:${{ env.PATCH }}
          build-args: |
            BASE_TAG=${{ env.PATCH }}
          tags: ${{ steps.version.outputs.autoindex_tags }}
      - name: Build and push scip-ruby image
        id: docker_build_scip_ruby
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          builder: ${{ steps.buildx.outputs.name }}
          file: Dockerfile
          push: true
          build-contexts: |
            scip-ruby-base=docker-image://scip-ruby-base:${{ env.PATCH }}
          build-args: |
            BASE_TAG=${{ env.PATCH }}
          tags: ${{ steps.version.outputs.scip_ruby_tags }}
